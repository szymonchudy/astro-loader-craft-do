name: Publish alpha
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@12.2.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Pack once
        run: |
          mkdir -p /tmp/craft-release
          npm pack --pack-destination /tmp/craft-release
      - name: Validate release artifact
        run: pnpm test:package --tarball /tmp/craft-release/astro-loader-craft-do-*.tgz
      - name: Publish through configured npm trusted publisher
        run: npm publish /tmp/craft-release/astro-loader-craft-do-*.tgz --access public --tag alpha
      - run: pnpm test:package 7.3.3 --registry
