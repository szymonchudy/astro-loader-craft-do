name: Publish alpha
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main commit (40-character SHA)
        required: true
        type: string
      expected_version:
        description: Reviewed alpha version
        required: true
        default: 0.1.0-alpha.1
        type: string
      published_source_sha:
        description: Original provenance source SHA, only for resuming an identical published artifact
        required: false
        type: string
      validate_only:
        description: Validate and retain the candidate archive without publishing
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: npm-publication
  cancel-in-progress: false
env:
  EXPECTED_SHA: ${{ inputs.expected_sha }}
  EXPECTED_VERSION: ${{ inputs.expected_version }}
  PUBLISHED_SOURCE_SHA: ${{ inputs.published_source_sha || inputs.expected_sha }}
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Check reviewed identity
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          assert.match(process.env.EXPECTED_SHA, /^[a-f0-9]{40}$/);
          assert.match(process.env.PUBLISHED_SOURCE_SHA, /^[a-f0-9]{40}$/);
          execFileSync('git', ['merge-base', '--is-ancestor', process.env.PUBLISHED_SOURCE_SHA, process.env.EXPECTED_SHA]);
          assert.match(process.env.EXPECTED_VERSION, /^0\.1\.0-alpha\.\d+$/);
          assert.equal(process.env.GITHUB_SHA, process.env.EXPECTED_SHA, 'Workflow provenance must use the reviewed source SHA');
          assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), process.env.EXPECTED_SHA);
          assert.equal(execFileSync('git', ['ls-remote', 'origin', 'refs/heads/main'], { encoding: 'utf8' }).split(/\s/)[0], process.env.EXPECTED_SHA);
          assert.equal(JSON.parse(readFileSync('package.json', 'utf8')).version, process.env.EXPECTED_VERSION);
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Pack once and record checksum
        run: |
          mkdir -p /tmp/craft-release
          npm pack --pack-destination /tmp/craft-release
          cd /tmp/craft-release
          sha256sum astro-loader-craft-do-*.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: craft-release-${{ inputs.expected_sha }}
          path: /tmp/craft-release/
          retention-days: 30
          if-no-files-found: error
  validate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: craft-release-${{ inputs.expected_sha }}
          path: /tmp/craft-release
      - run: cd /tmp/craft-release && sha256sum -c SHA256SUMS
      - name: Validate every advertised Astro consumer using the same archive
        run: pnpm test:package --tarball /tmp/craft-release/astro-loader-craft-do-*.tgz
  publish:
    if: ${{ !inputs.validate_only }}
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.2.0
      - run: pnpm install --frozen-lockfile
      - name: Reject a superseded candidate
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: craft-release-${{ inputs.expected_sha }}
          path: /tmp/craft-release
      - run: cd /tmp/craft-release && sha256sum -c SHA256SUMS
      - name: Recover an already-published identical artifact without republishing
        id: registry
        run: node scripts/verify-publication.mjs "/tmp/craft-release/astro-loader-craft-do-$EXPECTED_VERSION.tgz" "$EXPECTED_VERSION" "$EXPECTED_SHA" --preflight
      - name: Reject fresh publication with another provenance source
        env:
          REGISTRY_EXISTS: ${{ steps.registry.outputs.exists }}
        run: |
          node --input-type=module - <<'NODE'
          import { assertResumableSource } from './scripts/verify-publication.mjs';
          assertResumableSource(process.env.EXPECTED_SHA, process.env.PUBLISHED_SOURCE_SHA, process.env.REGISTRY_EXISTS === 'true');
          NODE
      - name: Publish the verified archive through npm trusted publishing
        if: steps.registry.outputs.exists != 'true'
        run: |
          # Use only OIDC; do not fall back to a saved user/token credential.
          printf 'registry=https://registry.npmjs.org/\n' > /tmp/craft-release.npmrc
          env -u NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG=/tmp/craft-release.npmrc npm publish /tmp/craft-release/astro-loader-craft-do-*.tgz --access public --tag "verification-$EXPECTED_VERSION"
      - name: Verify registry consumers, exact bytes and cryptographic source provenance
        run: |
          printf 'registry=https://registry.npmjs.org/\n' > /tmp/craft-release.npmrc
          env -u NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG=/tmp/craft-release.npmrc pnpm test:package --registry
          node scripts/verify-publication.mjs "/tmp/craft-release/astro-loader-craft-do-$EXPECTED_VERSION.tgz" "$EXPECTED_VERSION" "$PUBLISHED_SOURCE_SHA"
      - name: Advance alpha and latest after registry verification
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          printf 'registry=https://registry.npmjs.org/\n' > /tmp/craft-release.npmrc
          env -u NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG=/tmp/craft-release.npmrc npm dist-tag add "astro-loader-craft-do@$EXPECTED_VERSION" alpha
          env -u NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG=/tmp/craft-release.npmrc npm dist-tag add "astro-loader-craft-do@$EXPECTED_VERSION" latest
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import { boundedBody } from './scripts/verify-publication.mjs';
          const response = await fetch('https://registry.npmjs.org/astro-loader-craft-do', { redirect: 'error', signal: AbortSignal.timeout(20000) });
          assert(response.ok);
          const metadata = JSON.parse(await boundedBody(response));
          for (const tag of ['alpha', 'latest']) assert.equal(metadata['dist-tags'][tag], process.env.EXPECTED_VERSION);
          const staging = `verification-${process.env.EXPECTED_VERSION}`;
          if (metadata['dist-tags'][staging] !== undefined) {
            assert.equal(metadata['dist-tags'][staging], process.env.EXPECTED_VERSION, 'Do not remove a staging tag owned by another candidate');
            const { execFileSync } = await import('node:child_process');
            const env = { ...process.env, NPM_CONFIG_USERCONFIG: '/tmp/craft-release.npmrc' };
            delete env.NODE_AUTH_TOKEN;
            execFileSync('npm', ['dist-tag', 'rm', 'astro-loader-craft-do', staging], { env, stdio: 'inherit' });
          }
          console.log('Both release tags resolve to the verified artifact; staging cleanup is complete.');
          NODE
